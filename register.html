<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resolve Aí – Cadastro</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">

  <div class="auth-bg-shape shape-1"></div>
  <div class="auth-bg-shape shape-2"></div>

  <main class="auth-card register-card">
    <div class="logo-wrap">
      <img src="logo_resolveai.jpeg" alt="Resolve Aí" class="logo-img" />
      <div class="logo-fallback" id="logoFallback">
        <span class="logo-text-main">Resolve</span>
        <span class="logo-text-accent">Aí</span>
      </div>
    </div>

    <h1 class="auth-title">Crie sua conta</h1>
    <p class="auth-subtitle">Junte-se à comunidade Resolve Aí</p>

    <!-- Tipo de conta -->
    <div class="account-type-group">
      <p class="type-label">Quero me cadastrar como: <span class="required">*</span></p>
      <div class="type-options">
        <label class="type-card" id="labelUsuario">
          <input type="radio" name="accountType" value="usuario" id="typeUsuario" onchange="handleAccountType()" required />
          <div class="type-card-inner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Usuário</span>
            <small>Quero contratar serviços</small>
          </div>
        </label>
        <label class="type-card" id="labelPrestador">
          <input type="radio" name="accountType" value="prestador" id="typePrestador" onchange="handleAccountType()" required />
          <div class="type-card-inner">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            <span>Prestador</span>
            <small>Quero oferecer serviços</small>
          </div>
        </label>
      </div>
    </div>

    <div class="input-group">
      <label for="fullName">Nome completo <span class="required">*</span></label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="fullName" placeholder="Seu nome completo" required autocomplete="name" />
      </div>
    </div>

    <div class="input-group">
      <label for="email">E-mail <span class="required">*</span></label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email" />
      </div>
    </div>

    <div class="input-group">
      <label for="cpf">CPF <span class="required">*</span></label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="12" y2="13"/></svg>
        <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required autocomplete="off" oninput="maskCPF(this)" />
      </div>
    </div>

    <div class="input-group">
      <label for="cidade">Cidade <span class="required">*</span></label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        <input type="text" id="cidade" placeholder="Ex: São Paulo, SP" required autocomplete="address-level2" />
        <button class="toggle-password" type="button" onclick="detectarLocalizacao()" title="Usar minha localização" aria-label="Detectar localização">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="9" stroke-dasharray="2 4"/></svg>
        </button>
      </div>
    </div>

    <!-- Campo profissão (só aparece para prestador) -->
    <div class="input-group" id="profissaoGroup" style="display:none;">
      <label for="profissao">Profissão / Área de atuação <span class="required">*</span></label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
        <input type="text" id="profissao" placeholder="Ex: Eletricista, Personal Trainer, Fisioterapeuta..." />
      </div>
    </div>

    <div class="input-group">
      <label for="regPassword">Senha <span class="required">*</span></label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="regPassword" placeholder="Mínimo 8 caracteres" required autocomplete="new-password" oninput="checkPasswordStrength(this.value)" />
        <button class="toggle-password" type="button" onclick="togglePassword('regPassword', this)" aria-label="Mostrar senha">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <span class="strength-label" id="strengthLabel"></span>
    </div>

    <div class="input-group">
      <label for="confirmPassword">Confirmar senha <span class="required">*</span></label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="confirmPassword" placeholder="Repita a senha" required autocomplete="new-password" />
        <button class="toggle-password" type="button" onclick="togglePassword('confirmPassword', this)" aria-label="Mostrar senha">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <label class="terms-check">
      <input type="checkbox" id="terms" required />
      <span class="checkmark"></span>
      Li e aceito os <a href="#" class="link-accent">Termos de Uso</a> e a <a href="#" class="link-accent">Política de Privacidade</a>
    </label>

    <button class="btn-primary" onclick="handleRegister()">Criar conta</button>

    <p class="auth-switch">
      Já tem uma conta?
      <a href="index.html" class="link-accent">Fazer login</a>
    </p>
  </main>

  <script src="auth.js"></script>
</body>
</html>
