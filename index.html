<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resolve Aí – Login</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">

  <div class="auth-bg-shape shape-1"></div>
  <div class="auth-bg-shape shape-2"></div>

  <main class="auth-card" id="loginCard">
    <div class="logo-wrap">
      <img src="logo_resolveai.jpeg" alt="Resolve Aí" class="logo-img"
           onerror="this.style.display='none';document.getElementById('logoFallback').style.display='flex';" />
      <div class="logo-fallback" id="logoFallback">
        <span class="logo-text-main">Resolve</span>
        <span class="logo-text-accent">Aí</span>
      </div>
    </div>

    <h1 class="auth-title">Bem-vindo de volta!</h1>
    <p class="auth-subtitle">Acesse sua conta para continuar</p>

    <!-- Login com Google -->
    <button class="btn-google" id="btnGoogle" onclick="handleGoogleLogin()" type="button">
      <svg viewBox="0 0 24 24" width="20" height="20">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Entrar com Google
    </button>

    <div class="auth-divider"><span>ou entre com e-mail</span></div>

    <!-- E-mail ou CPF -->
    <div class="input-group">
      <label for="identifier">E-mail ou CPF</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="identifier" placeholder="seu@email.com ou 000.000.000-00" autocomplete="username" />
      </div>
    </div>

    <!-- Senha -->
    <div class="input-group">
      <label for="password">Senha</label>
      <div class="input-wrapper">
        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        <button class="toggle-password" type="button" onclick="togglePassword('password', this)" aria-label="Mostrar senha">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <!-- Opções -->
    <div class="auth-options">
      <label class="remember-me">
        <input type="checkbox" id="remember" />
        <span class="checkmark"></span>
        Lembrar-me
      </label>
      <a href="forgot-password.html" class="link-secondary">Esqueci a senha</a>
    </div>

    <button class="btn-primary" id="btnLogin" onclick="handleLogin()">Entrar</button>

    <div class="auth-divider" style="margin-top:20px;"><span>ou</span></div>

    <p class="auth-switch">
      Não tem uma conta?
      <a href="register.html" class="link-accent">Cadastre-se grátis</a>
    </p>
  </main>

  <script src="auth.js"></script>
  <script>
    function handleGoogleLogin() {
      const btn = document.getElementById('btnGoogle');
      btn.textContent = 'Conectando ao Google…';
      btn.disabled = true;

      setTimeout(() => {
        const googleUser = {
          name: 'Usuário Google',
          email: 'usuario@gmail.com',
          via: 'google',
          type: 'usuario',
          cidade: '',
        };
        sessionStorage.setItem('resolveai_user', JSON.stringify(googleUser));
        showToast('Login realizado com Google! ✅', 'success');
        setTimeout(() => window.location.href = 'home.html', 800);
      }, 1400);
    }
  </script>
</body>
</html>
