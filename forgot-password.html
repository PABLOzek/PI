<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resolve Aí – Esqueci a senha</title>
  <link rel="icon" type="image/jpeg" href="logo_resolveai.jpeg" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">

  <div class="auth-bg-shape shape-1"></div>
  <div class="auth-bg-shape shape-2"></div>

  <main class="auth-card">
    <div class="logo-wrap">
      <img src="logo_resolveai.jpeg" alt="Resolve Aí" class="logo-img" />
      <div class="logo-fallback" id="logoFallback">
        <span class="logo-text-main">Resolve</span>
        <span class="logo-text-accent">Aí</span>
      </div>
    </div>

    <div id="stepRequest">
      <h1 class="auth-title">Esqueceu a senha?</h1>
      <p class="auth-subtitle">Sem problemas! Informe seu e-mail e enviaremos um link para redefinição.</p>

      <div class="input-group">
        <label for="resetEmail">E-mail cadastrado</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" id="resetEmail" placeholder="seu@email.com" autocomplete="email" />
        </div>
      </div>

      <button class="btn-primary" style="width:100%" onclick="handleForgotPassword()">Enviar link de redefinição</button>
    </div>

    <div id="stepSuccess" style="display:none; text-align:center;">
      <div style="font-size:56px; margin-bottom:16px;">📬</div>
      <h1 class="auth-title">E-mail enviado!</h1>
      <p class="auth-subtitle" style="margin-bottom:28px">Verifique sua caixa de entrada e siga as instruções para redefinir sua senha.</p>
      <button class="btn-primary" style="width:100%" onclick="window.location.href='index.html'">Voltar ao login</button>
    </div>

    <div class="auth-divider"><span>ou</span></div>

    <p class="auth-switch">
      Lembrou a senha?
      <a href="index.html" class="link-accent">Fazer login</a>
    </p>
  </main>

  <script src="auth.js"></script>
  <script>
    function handleForgotPassword() {
      const email = document.getElementById('resetEmail').value.trim();
      if (!isValidEmail(email)) { showToast('Informe um e-mail válido.', 'error'); return; }
      const btn = document.querySelector('#stepRequest .btn-primary');
      btn.textContent = 'Enviando…'; btn.disabled = true;
      setTimeout(() => {
        document.getElementById('stepRequest').style.display = 'none';
        document.getElementById('stepSuccess').style.display = 'block';
      }, 1500);
    }
  </script>
</body>
</html>
